name: Publish patient-service image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional additional image version to publish, for example 0.2.0
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: patient-service

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::185678361427:role/GitHubActionsPatientServiceECR
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tags
        id: image-tags
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          tags="${REGISTRY}/${REPOSITORY}:${GITHUB_SHA}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            tags+=$'\n'"${REGISTRY}/${REPOSITORY}:${version}"
          elif [[ -n "$INPUT_IMAGE_TAG" ]]; then
            tags+=$'\n'"${REGISTRY}/${REPOSITORY}:${INPUT_IMAGE_TAG}"
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
