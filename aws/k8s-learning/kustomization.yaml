apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../k8s/namespace.yaml
  - ../../k8s/configmap.yaml
  - ../../k8s/dependencies.yaml
  - ../../k8s/deployment.yaml
  - ../../k8s/service.yaml
  - ../../k8s/pdb.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: patient-service
      namespace: patient
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres
      namespace: patient
    patch: |-
      - op: remove
        path: /spec/volumeClaimTemplates
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: postgres-data
            emptyDir: {}
  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: patient-service-pdb
      namespace: patient
    patch: |-
      - op: remove
        path: /spec/minAvailable
      - op: add
        path: /spec/maxUnavailable
        value: 1
